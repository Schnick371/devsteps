<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960"
     font-family="'Segoe UI', Helvetica, Arial, sans-serif">

  <!-- ===== MARKERS ===== -->
  <defs>
    <marker id="spawn" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#0d9488"/>
    </marker>
    <marker id="peer" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#94a3b8"/>
    </marker>
    <marker id="gate" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="960" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="34" font-size="20" font-weight="bold" fill="#1e3a5f">Fish-net Cascade — Autonomous Subagent Propagation</text>
  <text x="40" y="52" font-size="11" fill="#64748b">Agents that find important signals autonomously spawn siblings (→ same ring) or children (↓ next ring) — all results converge at gate-reviewer (bottom-right).</text>

  <!-- CONCEPT badge -->
  <rect x="820" y="12" width="362" height="26" rx="4" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
  <text x="832" y="29" font-size="10" font-weight="bold" fill="#854d0e">⚠ CONCEPT — Not Yet Implemented</text>

  <!-- ============================================================
       RING LABELS (left margin)
  ============================================================ -->
  <text x="14" y="125" font-size="9" font-weight="bold" fill="#1e3a5f" transform="rotate(-90,14,125)">Ring 0</text>
  <text x="14" y="285" font-size="9" font-weight="bold" fill="#0d9488" transform="rotate(-90,14,285)">Ring 1</text>
  <text x="14" y="465" font-size="9" font-weight="bold" fill="#0891b2" transform="rotate(-90,14,465)">Ring 2</text>
  <text x="14" y="635" font-size="9" font-weight="bold" fill="#d97706" transform="rotate(-90,14,635)">Ring 3</text>
  <text x="14" y="785" font-size="9" font-weight="bold" fill="#1d4ed8" transform="rotate(-90,14,785)">Ring 4</text>
  <text x="14" y="910" font-size="9" font-weight="bold" fill="#15803d" transform="rotate(-90,14,910)">Ring 5</text>

  <!-- Row separator lines -->
  <line x1="40" y1="160" x2="1160" y2="160" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="40" y1="340" x2="1160" y2="340" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="40" y1="520" x2="1160" y2="520" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="40" y1="700" x2="1160" y2="700" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="40" y1="860" x2="1160" y2="860" stroke="#f1f5f9" stroke-width="1"/>

  <!-- ============================================================
       ROW 0 — coord top-left (Ring 0)
  ============================================================ -->
  <circle cx="100" cy="112" r="22" fill="#1e3a5f"/>
  <text x="100" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="white">coord</text>
  <text x="100" y="120" text-anchor="middle" font-size="9" fill="#93c5fd">Ring 0</text>

  <!-- coord → spawns 3 R1 analysts (diagonal down-right) -->
  <line x1="116" y1="127" x2="228" y2="253" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#spawn)"/>
  <line x1="122" y1="112" x2="468" y2="252" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#spawn)"/>
  <line x1="122" y1="104" x2="707" y2="251" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#spawn)"/>

  <!-- ============================================================
       ROW 1 — Ring 1 Analysts (y=266)
       coord starts 3; each may spawn siblings → right
  ============================================================ -->

  <!-- analyst-context (240,266) -->
  <circle cx="240" cy="266" r="15" fill="#0d9488"/>
  <text x="240" y="255" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">analyst</text>
  <text x="240" y="266" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">-context</text>

  <!-- analyst-internal (480,266) -->
  <circle cx="480" cy="266" r="15" fill="#0d9488"/>
  <text x="480" y="255" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">analyst</text>
  <text x="480" y="266" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">-internal</text>

  <!-- analyst-risk (720,266) -->
  <circle cx="720" cy="266" r="15" fill="#0d9488"/>
  <text x="720" y="255" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">analyst</text>
  <text x="720" y="266" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">-risk</text>

  <!-- internal finds signal → spawns analyst-quality -->
  <line x1="495" y1="266" x2="935" y2="266" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#peer)"/>
  <text x="715" y="258" text-anchor="middle" font-size="8" fill="#94a3b8" font-style="italic">internal finds deep signal →</text>

  <!-- analyst-quality (950,266) spawned by internal -->
  <circle cx="950" cy="266" r="15" fill="#0d9488"/>
  <text x="950" y="255" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">analyst</text>
  <text x="950" y="266" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">-quality</text>
  <text x="950" y="289" text-anchor="middle" font-size="8" fill="#64748b" font-style="italic">↑ spawned by -internal</text>

  <!-- peer arrows between initial 3 analysts -->
  <line x1="255" y1="266" x2="460" y2="266" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#peer)"/>
  <line x1="495" y1="266" x2="700" y2="266" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#peer)"/>

  <!-- ============================================================
       R1 → R2: each analyst triggers one aspect (↓)
  ============================================================ -->
  <line x1="246" y1="281" x2="296" y2="413" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#spawn)"/>
  <line x1="486" y1="281" x2="536" y2="413" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#spawn)"/>
  <line x1="726" y1="281" x2="776" y2="413" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#spawn)"/>
  <line x1="956" y1="281" x2="1006" y2="413" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#spawn)"/>

  <!-- ============================================================
       ROW 2 — Ring 2 Aspects (y=428)
  ============================================================ -->

  <!-- aspect-constraints (308,428) -->
  <circle cx="308" cy="428" r="13" fill="#0891b2"/>
  <text x="308" y="418" text-anchor="middle" font-size="8" font-weight="600" fill="#0891b2">aspect</text>
  <text x="308" y="428" text-anchor="middle" font-size="8" font-weight="600" fill="#0891b2">-constraints</text>

  <!-- aspect-impact (548,428) -->
  <circle cx="548" cy="428" r="13" fill="#0891b2"/>
  <text x="548" y="418" text-anchor="middle" font-size="8" font-weight="600" fill="#0891b2">aspect</text>
  <text x="548" y="428" text-anchor="middle" font-size="8" font-weight="600" fill="#0891b2">-impact</text>

  <!-- aspect-staleness (788,428) -->
  <circle cx="788" cy="428" r="13" fill="#0891b2"/>
  <text x="788" y="418" text-anchor="middle" font-size="8" font-weight="600" fill="#0891b2">aspect</text>
  <text x="788" y="428" text-anchor="middle" font-size="8" font-weight="600" fill="#0891b2">-staleness</text>

  <!-- staleness finds signal → spawns aspect-integration -->
  <line x1="801" y1="428" x2="1005" y2="428" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#peer)"/>
  <text x="903" y="420" text-anchor="middle" font-size="8" fill="#94a3b8" font-style="italic">staleness finds drift →</text>

  <!-- aspect-quality (1018,428) triggered by analyst-quality -->
  <!-- aspect-integration (1018,428) — combined node -->
  <circle cx="1018" cy="428" r="13" fill="#0891b2"/>
  <text x="1018" y="418" text-anchor="middle" font-size="8" font-weight="600" fill="#0891b2">aspect</text>
  <text x="1018" y="428" text-anchor="middle" font-size="8" font-weight="600" fill="#0891b2">-integration</text>
  <text x="1018" y="450" text-anchor="middle" font-size="8" fill="#64748b" font-style="italic">↑ spawned by -staleness</text>

  <!-- peer arrows between aspects -->
  <line x1="321" y1="428" x2="531" y2="428" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#peer)"/>
  <line x1="561" y1="428" x2="771" y2="428" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#peer)"/>

  <!-- ============================================================
       R2 → R3: all aspects converge → exec-planner
  ============================================================ -->
  <line x1="312" y1="441" x2="525" y2="590" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#spawn)"/>
  <line x1="548" y1="441" x2="543" y2="590" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#spawn)"/>
  <line x1="781" y1="441" x2="560" y2="590" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#spawn)"/>
  <line x1="1014" y1="441" x2="575" y2="590" stroke="#0d9488" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#spawn)"/>

  <!-- converge label -->
  <text x="640" y="520" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">all aspects converge →</text>

  <!-- ============================================================
       ROW 3 — exec-planner single node (y=605)
  ============================================================ -->
  <circle cx="550" cy="605" r="18" fill="#d97706"/>
  <text x="550" y="600" text-anchor="middle" font-size="11" font-weight="bold" fill="white">planner</text>
  <text x="550" y="613" text-anchor="middle" font-size="8" fill="#fef3c7">Ring 3</text>

  <!-- ============================================================
       R3 → R4: planner spawns exec agents
  ============================================================ -->
  <line x1="537" y1="622" x2="338" y2="748" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#spawn)"/>
  <line x1="550" y1="623" x2="590" y2="748" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#spawn)"/>
  <line x1="563" y1="622" x2="840" y2="748" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#spawn)"/>

  <!-- ============================================================
       ROW 4 — Ring 4 exec agents + workers (y=762)
  ============================================================ -->

  <!-- exec-impl (340,762) -->
  <circle cx="340" cy="762" r="14" fill="#1d4ed8"/>
  <text x="340" y="752" text-anchor="middle" font-size="9" font-weight="600" fill="#1d4ed8">exec-impl</text>

  <!-- impl → workers (peer spawn →) -->
  <line x1="354" y1="762" x2="548" y2="762" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#peer)"/>
  <text x="451" y="754" text-anchor="middle" font-size="8" fill="#94a3b8" font-style="italic">spawns workers →</text>

  <!-- worker-coder (562,762) -->
  <circle cx="562" cy="762" r="11" fill="#475569"/>
  <text x="562" y="751" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">worker</text>
  <text x="562" y="762" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">-coder</text>

  <!-- exec-test (850,762) -->
  <circle cx="850" cy="762" r="14" fill="#1d4ed8"/>
  <text x="850" y="752" text-anchor="middle" font-size="9" font-weight="600" fill="#1d4ed8">exec-test</text>

  <!-- test → sibling workers → -->
  <line x1="864" y1="762" x2="1000" y2="762" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#peer)"/>

  <!-- worker-tester (1014,762) -->
  <circle cx="1014" cy="762" r="11" fill="#475569"/>
  <text x="1014" y="751" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">worker</text>
  <text x="1014" y="762" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">-tester</text>

  <!-- exec-test also spawns exec-doc vertically -->
  <line x1="860" y1="776" x2="930" y2="856" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#spawn)"/>

  <!-- exec-doc (942,870) -->
  <circle cx="942" cy="870" r="11" fill="#1d4ed8"/>
  <text x="942" y="860" text-anchor="middle" font-size="8" font-weight="600" fill="#1d4ed8">exec-doc</text>
  <text x="942" y="888" text-anchor="middle" font-size="8" fill="#64748b" font-style="italic">spawned by exec-test</text>

  <!-- ============================================================
       CONVERGE → gate-reviewer (bottom-right)
       All exec results flow to gate
  ============================================================ -->
  <!-- from exec-impl -->
  <line x1="353" y1="773" x2="1088" y2="890" stroke="#15803d" stroke-width="1.4" marker-end="url(#gate)"/>
  <!-- from worker-coder -->
  <line x1="573" y1="771" x2="1090" y2="892" stroke="#15803d" stroke-width="1.2" marker-end="url(#gate)"/>
  <!-- from exec-test -->
  <line x1="864" y1="773" x2="1095" y2="888" stroke="#15803d" stroke-width="1.4" marker-end="url(#gate)"/>
  <!-- from worker-tester -->
  <line x1="1022" y1="773" x2="1100" y2="886" stroke="#15803d" stroke-width="1.2" marker-end="url(#gate)"/>
  <!-- from exec-doc -->
  <line x1="954" y1="876" x2="1098" y2="895" stroke="#15803d" stroke-width="1.2" marker-end="url(#gate)"/>

  <!-- ============================================================
       GATE-REVIEWER — bottom-right
  ============================================================ -->
  <circle cx="1120" cy="906" r="22" fill="#15803d"/>
  <text x="1120" y="901" text-anchor="middle" font-size="11" font-weight="bold" fill="white">gate</text>
  <text x="1120" y="914" text-anchor="middle" font-size="10" fill="#dcfce7">reviewer</text>
  <text x="1120" y="933" text-anchor="middle" font-size="9" font-weight="bold" fill="#15803d">PASS / FAIL</text>

  <!-- ============================================================
       EXPLANATION BOX
  ============================================================ -->
  <rect x="40" y="610" width="440" height="130" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="56" y="630" font-size="11" font-weight="bold" fill="#15803d">Cascade rules:</text>
  <text x="56" y="648" font-size="9" fill="#374151">1. coord (top-left) spawns 3 initial R1 analysts (↓)</text>
  <text x="56" y="662" font-size="9" fill="#374151">2. Each analyst may spawn a sibling in R1 (→) if signal found</text>
  <text x="56" y="676" font-size="9" fill="#374151">3. Analysts independently trigger R2 aspects (↓)</text>
  <text x="56" y="690" font-size="9" fill="#374151">4. Aspects may spawn sibling aspects (→) on discovery</text>
  <text x="56" y="704" font-size="9" fill="#374151">5. All aspects converge → exec-planner (R3) (↓)</text>
  <text x="56" y="718" font-size="9" fill="#374151">6. Planner spawns exec agents (↓); execs spawn workers (→)</text>
  <text x="56" y="732" font-size="9" fill="#374151">7. All results converge → gate-reviewer (bottom-right) ✓</text>

  <!-- ============================================================
       LEGEND strip
  ============================================================ -->
  <rect x="40" y="940" width="1120" height="12" rx="3" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="55" y1="946" x2="90" y2="946" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#spawn)"/>
  <text x="95" y="950" font-size="9" fill="#0d9488">spawn child (↓ next ring)</text>
  <line x1="235" y1="946" x2="270" y2="946" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#peer)"/>
  <text x="275" y="950" font-size="9" fill="#64748b">spawn sibling (→ same ring)</text>
  <line x1="435" y1="946" x2="470" y2="946" stroke="#15803d" stroke-width="1.5" marker-end="url(#gate)"/>
  <text x="475" y="950" font-size="9" fill="#15803d">converge to gate</text>
  <circle cx="605" cy="946" r="5" fill="#1e3a5f"/>
  <text x="614" y="950" font-size="9" fill="#1e3a5f">coord R0</text>
  <circle cx="673" cy="946" r="5" fill="#0d9488"/>
  <text x="682" y="950" font-size="9" fill="#0d9488">analyst R1</text>
  <circle cx="748" cy="946" r="5" fill="#0891b2"/>
  <text x="757" y="950" font-size="9" fill="#0891b2">aspect R2</text>
  <circle cx="820" cy="946" r="5" fill="#d97706"/>
  <text x="829" y="950" font-size="9" fill="#d97706">planner R3</text>
  <circle cx="896" cy="946" r="5" fill="#1d4ed8"/>
  <text x="905" y="950" font-size="9" fill="#1d4ed8">exec R4</text>
  <circle cx="952" cy="946" r="5" fill="#15803d"/>
  <text x="961" y="950" font-size="9" fill="#15803d">gate R5</text>

</svg>
