<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="burn-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="burn-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
    <filter id="spark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>

  <!-- Kanban column separators -->
  <line x1="44" y1="20" x2="44" y2="112" stroke="rgba(255,255,255,0.09)" stroke-width="0.75"/>
  <line x1="86" y1="20" x2="86" y2="112" stroke="rgba(255,255,255,0.09)" stroke-width="0.75"/>
  <line x1="12" y1="24" x2="116" y2="24" stroke="rgba(255,255,255,0.09)" stroke-width="0.75"/>

  <!-- Column status dots — muted white only, varying opacity -->
  <circle cx="28" cy="19" r="2.5" fill="rgba(255,255,255,0.35)"/>
  <circle cx="65" cy="19" r="2.5" fill="rgba(255,255,255,0.22)"/>
  <circle cx="100" cy="19" r="2.5" fill="rgba(255,255,255,0.15)"/>

  <!-- Work item cards — left column -->
  <rect x="14" y="30" width="26" height="8" rx="2.5" fill="rgba(255,255,255,0.16)"/>
  <rect x="14" y="44" width="26" height="8" rx="2.5" fill="rgba(255,255,255,0.11)"/>
  <rect x="14" y="58" width="22" height="8" rx="2.5" fill="rgba(255,255,255,0.07)"/>

  <!-- Work item cards — middle column -->
  <rect x="50" y="30" width="26" height="8" rx="2.5" fill="rgba(255,255,255,0.14)"/>
  <rect x="50" y="44" width="20" height="8" rx="2.5" fill="rgba(255,255,255,0.09)"/>

  <!-- Work item cards — right column -->
  <rect x="90" y="30" width="26" height="8" rx="2.5" fill="rgba(255,255,255,0.12)"/>

  <!-- Ideal burndown reference line — scaled from original v1-17 -->
  <line x1="12" y1="30" x2="116" y2="110"
        stroke="rgba(255,255,255,0.18)" stroke-width="1"
        stroke-dasharray="2,5" stroke-linecap="round"/>

  <!-- Hero: Burndown zigzag — path scaled from v1-17-burndown-zigzag.svg -->
  <!-- Glow layer -->
  <path d="M 12 30 L 32.4 37.9 L 46.4 41.8 L 64.9 69.3 L 82.6 73.9 L 93.7 92.3 L 116 103.4"
        stroke="#93C5FD" stroke-width="5"
        filter="url(#burn-glow)"
        fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  <!-- Sharp line -->
  <path d="M 12 30 L 32.4 37.9 L 46.4 41.8 L 64.9 69.3 L 82.6 73.9 L 93.7 92.3 L 116 103.4"
        stroke="url(#burn-grad)" stroke-width="2"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom axis -->
  <line x1="12" y1="116" x2="116" y2="116" stroke="rgba(255,255,255,0.06)" stroke-width="0.75"/>

  <!-- AI Sparkle — top-right above board (x≈92–111, y≈2–23 in 128x128 space) -->
  <g transform="translate(54, 2) scale(2.8)" fill="#4DD0E1" filter="url(#spark-glow)">
    <path d="M18.6225 5.124C18.882 4.8645 19.2 4.668 19.5495 4.5525L20.697 4.179C20.7855 4.1475 20.862 4.0905 20.916 4.014C20.97 3.9375 20.9985 3.846 20.9985 3.753C20.9985 3.66 20.97 3.5685 20.916 3.492C20.862 3.4155 20.7855 3.357 20.697 3.327L20.6745 3.321L19.527 2.9475C19.2885 2.868 19.065 2.7525 18.864 2.604C18.771 2.535 18.6825 2.4585 18.6 2.376C18.3405 2.1165 18.144 1.7985 18.0285 1.4505L17.655 0.302995C17.6235 0.214495 17.5665 0.137995 17.49 0.0839954C17.4195 0.0344954 17.337 0.00599536 17.2515 0.00149536H17.229C17.1345 0.00149536 17.043 0.0299954 16.9665 0.0839954C16.89 0.137995 16.8315 0.214495 16.8015 0.302995L16.428 1.4505C16.314 1.797 16.122 2.112 15.8655 2.3715C15.828 2.409 15.7905 2.445 15.7515 2.4795C15.519 2.6865 15.2475 2.8455 14.952 2.9475L13.8045 3.321C13.716 3.3525 13.6395 3.4095 13.5855 3.486C13.5315 3.5625 13.5015 3.654 13.5015 3.747C13.5015 3.84 13.53 3.933 13.5855 4.0095C13.641 4.086 13.716 4.1445 13.8045 4.1745L14.952 4.548C14.997 4.563 15.042 4.5795 15.087 4.5975C15.384 4.7175 15.654 4.8945 15.8805 5.1225C16.0155 5.259 16.134 5.409 16.2315 5.5725C16.3215 5.7225 16.395 5.883 16.4505 6.051L16.824 7.19849C16.8555 7.28699 16.9125 7.3635 16.989 7.4175C17.0655 7.4715 17.157 7.5015 17.2515 7.5015H17.2575C17.349 7.5015 17.439 7.4715 17.514 7.4175C17.565 7.3815 17.607 7.335 17.64 7.2825C17.6565 7.2555 17.67 7.22699 17.6805 7.19849L18.054 6.051C18.1695 5.7015 18.366 5.385 18.6255 5.1255L18.6225 5.124Z"/>
  </g>

  <!-- Outer frame -->
  <rect x="1" y="1" width="126" height="126" rx="19.5"
        fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>

</svg>
